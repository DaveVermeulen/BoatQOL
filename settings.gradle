pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Babric'; url = 'https://maven.glass-launcher.net/babric' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'BoatQOL'

// Open this folder in IntelliJ and each port shows up as a module, with its
// own "Minecraft Client" / "Minecraft Server" run configurations.
include 'b1.7.3'
