name: Release

# Builds every port and publishes one GitHub release per port, with the mod jar and a
# packwiz metadata file. Run it from the Actions tab (Run workflow) after bumping
# mod_version in a port's gradle.properties. Releases whose tag already exists are skipped.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 8 runs Minecraft 1.7.10, 17 decompiles it, 21 runs Gradle (the last one is the default).
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - run: scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the latest packwiz files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packwiz
          if ! git diff --cached --quiet; then
            git commit -m "Update packwiz files for the new releases"
            git push
          fi
