plugins {
    id 'fabric-loom' version '1.17.21'
    id 'babric-loom-extension' version '1.17.5'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

loom {
    runs {
        configureEach {
            // Also generate IntelliJ run configurations when this is a module of the root project.
            ideConfigGenerated(true)
        }
    }
}

repositories {
    maven { name = 'Babric'; url = 'https://maven.glass-launcher.net/babric' }
    maven { name = 'Glass Releases'; url = 'https://maven.glass-launcher.net/releases' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.glasslauncher:biny:${project.biny_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

